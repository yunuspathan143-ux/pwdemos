name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the test run from GitHub UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout code
      uses: actions/checkout@v4

    - name: 2. Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: 3. Install dependencies
      run: npm ci

    - name: 4. Install Playwright Browsers and OS dependencies
      run: npx playwright install --with-deps

    - name: 5. Run Playwright tests
      run: npm test

    - name: 6. Upload HTML Test Report as an Artifact
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }} # Upload even if tests fail so you can inspect failures
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
